<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AES Encrypted Message Board</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #f5f7fa; }
    h1 { color: #2d3748; text-align: center; }
    .card { background: white; padding: 1.5rem; margin: 1rem 0; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    textarea, input[type="text"] { width: 100%; padding: 0.75rem; margin: 0.5rem 0; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    button { padding: 0.75rem 1.5rem; margin: 0.5rem 0.25rem; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #2b6cb0; color: white; }
    .btn-primary:hover { background: #2c5282; }
    .btn-success { background: #2f855a; color: white; }
    .btn-success:hover { background: #276749; }
    .message-item { padding: 1rem; background: #f7fafc; border-radius: 6px; margin: 0.5rem 0; border-left: 4px solid #2b6cb0; }
    .ciphertext { font-family: monospace; font-size: 0.9rem; color: #4a5568; word-break: break-all; }
    .decrypted { margin-top: 0.5rem; padding: 0.5rem; background: #f0fff4; border-radius: 4px; color: #22543d; }
    .label { font-weight: 600; color: #2d3748; margin-top: 0.75rem; display: inline-block; }
    .status { margin-top: 0.75rem; padding: 0.5rem; border-radius: 4px; display: none; }
    .status.success { background: #f0fff4; color: #22543d; display: block; }
    .status.error { background: #fed7d7; color: #742a2a; display: block; }
    .note { font-size: 0.9rem; color: #718096; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>🔐 AES Encrypted Message Board</h1>

  <!-- Encrypt & Post Section -->
  <div class="card">
    <h2>Encrypt & Post a Message</h2>
    <label class="label">Your Message:</label>
    <textarea id="messageInput" rows="4" placeholder="Enter your secret message here..."></textarea>
    <label class="label">Secret Key (keep this private!):</label>
    <input type="text" id="secretKey" placeholder="e.g. MySecretPass123">
    <button class="btn-primary" onclick="encryptAndPost()">🔒 Encrypt & Post</button>
    <div id="postStatus" class="status"></div>
    <p class="note">⚠️ The key encrypts your message — share it only with those you trust. The encrypted message is stored publicly.</p>
  </div>

  <!-- Decrypt Section -->
  <div class="card">
    <h2>Decrypt a Message</h2>
    <label class="label">Encrypted Message (paste from below):</label>
    <textarea id="ciphertextInput" rows="3" placeholder="Paste the encrypted text here..."></textarea>
    <label class="label">Your Secret Key:</label>
    <input type="text" id="decryptKey" placeholder="Enter the shared key...">
    <button class="btn-success" onclick="decryptMessage()">🔓 Decrypt</button>
    <div id="decryptResult" class="decrypted" style="display:none;"></div>
  </div>

  <!-- Public Message Board -->
  <div class="card">
    <h2>📨 Public Encrypted Messages</h2>
    <button class="btn-primary" onclick="loadMessages()">🔄 Refresh Messages</button>
    <div id="messagesList"></div>
  </div>

  <script>
    // ==================================================
    // UPDATE THIS WITH YOUR APPS SCRIPT WEB APP URL
    // Must end with /exec (not /dev)
    // ==================================================
    const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcpPtWdqiYpcXmZlGvlfoOfSpG4ypMUFIji0dXH4JD638ppllPz-o1x-v29rHKT_RF/exec";

    // AES Encryption
    function encryptMessage(message, key) {
      return CryptoJS.AES.encrypt(message, key).toString();
    }

    // Decrypt message
    function decryptMessage() {
      const ciphertext = document.getElementById("ciphertextInput").value.trim();
      const key = document.getElementById("decryptKey").value;

      if (!ciphertext || !key) {
        alert("Please enter both encrypted message and the key.");
        return;
      }

      try {
        const bytes = CryptoJS.AES.decrypt(ciphertext, key);
        const plaintext = bytes.toString(CryptoJS.enc.Utf8);

        if (!plaintext) {
          document.getElementById("decryptResult").style.display = "block";
          document.getElementById("decryptResult").innerHTML = "❌ Wrong key or invalid message.";
          return;
        }

        document.getElementById("decryptResult").style.display = "block";
        document.getElementById("decryptResult").innerHTML = "<strong>✅ Decrypted:</strong><br>" + plaintext;
      } catch (err) {
        document.getElementById("decryptResult").style.display = "block";
        document.getElementById("decryptResult").innerHTML = "❌ Decryption failed: " + err.message;
      }
    }

    // Encrypt and post to Google Sheet
    async function encryptAndPost() {
      const message = document.getElementById("messageInput").value.trim();
      const key = document.getElementById("secretKey").value;
      const statusBox = document.getElementById("postStatus");

      if (!message || !key) {
        statusBox.className = "status error";
        statusBox.textContent = "Please enter both message and key.";
        return;
      }

      const encrypted = encryptMessage(message, key);
      statusBox.className = "status";
      statusBox.textContent = "Encrypting...";

      try {
        const response = await fetch(APPSCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ciphertext: encrypted })
        });

        const result = await response.json();
        if (!result.success) throw new Error(result.error || "Unknown error");

        statusBox.className = "status success";
        statusBox.textContent = "✅ Posted successfully! Encrypted message: " + encrypted.substring(0, 40) + "...";

        document.getElementById("messageInput").value = "";
        document.getElementById("secretKey").value = "";

        loadMessages();
      } catch (err) {
        statusBox.className = "status error";
        statusBox.textContent = "❌ Error: " + err.message;
      }
    }

    // Load all messages from Google Sheet
    async function loadMessages() {
      const container = document.getElementById("messagesList");
      container.innerHTML = "<p>Loading...</p>";

      try {
        const response = await fetch(APPSCRIPT_URL);
        const data = await response.json();

        if (!data.success || !data.messages || data.messages.length === 0) {
          container.innerHTML = "<p>No messages yet.</p>";
          return;
        }

        container.innerHTML = "";
        data.messages.reverse().forEach((row) => {
          const time = row[0];
          const ciphertext = row[1];
          const div = document.createElement("div");
          div.className = "message-item";
          div.innerHTML = `
            <small><strong>${time}</strong></small>
            <div class="ciphertext">${ciphertext}</div>
            <button class="btn-primary" style="padding:0.3rem 0.6rem; font-size:0.85rem; margin-top:0.5rem;"
              onclick="document.getElementById('ciphertextInput').value='${ciphertext.replace(/'/g, "\\'").replace(/"/g, "&quot;")}'">📋 Copy to Decrypt Box</button>
          `;
          container.appendChild(div);
        });
      } catch (err) {
        container.innerHTML = `<p style="color:red;">❌ Failed to load: ${err.message}</p>`;
      }
    }

    // Auto-load messages on page open
    window.onload = loadMessages;
  </script>
</body>
</html>
